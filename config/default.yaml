# Default settings. Override locally in config/local.yaml (not committed).

robot:
  ip: "192.168.1.xxx"        # set in config/local.yaml
  speed_mm_s: 100            # TCP speed during play
  debug_speed_mm_s: 50       # TCP speed when testing new motion code
  acc_mm_s2: 500
  home_pose_mm: [300, 0, 300, 180, 0, 0]   # x, y, z, roll, pitch, yaw (deg) - TBD
  # Heights relative to table surface (table_z comes from calibration)
  heights_mm:
    safe: 80
    approach: 20
    grasp: 8                 # TBD: depends on piece height and gripper
    release: 2
  # Software workspace limits in robot base frame (second layer after xArm Studio safety boundary)
  workspace_mm:
    x: [100, 700]
    y: [-450, 450]
    z: [-20, 400]

camera:
  index: 0
  resolution: [1920, 1080]
  intrinsics_file: config/calibration/camera.yaml

board:
  map_file: config/maps/autumn.yaml
  # No markers: keypoints of each frame are matched against a top-down reference image of the
  # empty board (made once by scripts/make_board_reference.py, not committed).
  reference_image: data/reference/board_autumn.png
  # Outer board size in mm [long side, short side], measured once. Origin: board corner on the
  # far side from the robot, on the left; X along the long side, Y towards the robot.
  size_mm: [0, 0]            # TBD
  detector:                  # TBD: tune on real frames
    ratio_test: 0.75         # Lowe's ratio test for keypoint matches
    ransac_reproj_px: 3.0    # RANSAC inlier threshold, reference image px
    min_inliers: 40          # fewer -> board not found, fall back to the last good homography
  max_shift_mm: 3            # warn the operator if the board moved since board -> robot calibration
  warp_px_per_mm: 2
  board_to_robot_file: config/calibration/board_to_robot.yaml

supply:
  # Slots of the bot's warrior tray, board frame (mm) - TBD after tray is printed
  slots_mm: []

game:
  dice: software             # software | manual
