name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        # Exit code 5 = no tests collected yet; remove the fallback once tests exist
        run: pytest || [ $? -eq 5 ]
