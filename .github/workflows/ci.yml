name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:         # manual run: Actions -> CI -> Run workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest
